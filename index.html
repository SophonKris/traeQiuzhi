<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subtext · 潜台词解码器</title>
<style>
:root{
  --paper:#F7F3EC; --card:#FFFDF8; --ink:#1C1814; --ink2:#5C554B; --line:#E3D9C9;
  --red:#C13A17; --blue:#1D5C8F; --plum:#6E4A8C; --mark:#FFE39A; --green:#2E6B4F;
  --serif:'Noto Serif SC','Songti SC',STSong,SimSun,serif;
  --sans:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;
  --mono:Consolas,'JetBrains Mono',SFMono-Regular,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);color:var(--ink);background:
    radial-gradient(1100px 700px at 88% -8%,rgba(193,58,23,.055),transparent 62%),
    radial-gradient(900px 650px at -8% 108%,rgba(29,92,143,.05),transparent 60%),
    var(--paper);
  min-height:100vh;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.04'/></svg>");}
/* ---------- header ---------- */
header{position:relative;z-index:2;border-bottom:2px solid var(--ink);
  display:flex;align-items:center;gap:18px;padding:16px 28px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:900;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.brand i{width:14px;height:14px;background:var(--red);display:inline-block;flex:none}
.brand em{font-style:normal;font-size:15px;color:var(--ink2);letter-spacing:.14em;font-weight:600;margin-left:2px}
.tagline{font-family:var(--mono);font-size:12.5px;color:var(--ink2);letter-spacing:.02em;flex:1;min-width:220px}
.privacy{width:100%;font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:8px;display:flex;gap:8px;align-items:center}
.privacy b{color:var(--green);font-weight:700}
.privacy::before{content:' PRIVACY ';font-family:var(--mono);font-size:10px;color:var(--paper);background:var(--green);padding:1px 6px;letter-spacing:.15em;flex:none}
.hbtn{position:relative;font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--ink);background:var(--card);
  border:2px solid var(--ink);padding:8px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:.15s;flex:none}
.hbtn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.hbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.hbtn .dot{position:absolute;top:-5px;right:-5px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--paper)}
.hbtn.ok .dot{background:var(--green)}
/* ---------- layout ---------- */
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:22px 28px 60px;display:grid;grid-template-columns:440px 1fr;gap:22px;align-items:start}
@media(max-width:980px){.wrap{grid-template-columns:1fr}.left{position:static!important}}
.left{position:sticky;top:18px;display:flex;flex-direction:column;gap:14px}
.pane{background:var(--card);border:1.5px solid var(--ink);box-shadow:5px 5px 0 rgba(28,24,20,.14)}
.pane-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink2)}
.pane-h b{color:var(--ink);letter-spacing:.18em}
textarea{width:100%;min-height:250px;resize:vertical;border:0;outline:0;background:transparent;padding:14px;
  font-family:var(--mono);font-size:13px;line-height:1.75;color:var(--ink)}
textarea::placeholder{color:#B4AA98}
.tools{display:flex;flex-direction:column;gap:12px}
.samples{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.samples button{font-family:var(--mono);font-size:12px;padding:5px 10px;background:transparent;border:1px solid var(--ink2);
  color:var(--ink);cursor:pointer;transition:.12s}
.samples button:hover{background:var(--ink);color:var(--paper)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-size:13.5px;font-weight:600}
.switch small{font-weight:400;color:var(--ink2);font-size:12px}
.switch input{display:none}
.switch .tr{width:38px;height:20px;border:1.5px solid var(--ink);background:var(--card);position:relative;transition:.15s;flex:none}
.switch .tr::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--ink2);transition:.15s}
.switch input:checked+.tr{background:var(--plum)}
.switch input:checked+.tr::after{left:20px;background:#fff}
.switch.off{opacity:.42;cursor:not-allowed}
.switch.off small::after{content:'（内置示例结果已预置，开关不生效）'}
.decode-btn{font-family:var(--sans);font-size:17px;font-weight:900;letter-spacing:.28em;padding:15px 0;width:100%;
  background:var(--ink);color:var(--paper);border:2px solid var(--ink);cursor:pointer;box-shadow:4px 4px 0 rgba(193,58,23,.85);transition:.15s}
.decode-btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(193,58,23,.9)}
.decode-btn:disabled{opacity:.55;cursor:wait}
.hint{font-family:var(--mono);font-size:11.5px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.hint .dot2{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none}
.hint.ok .dot2{background:var(--green)}
.hint kbd{border:1px solid var(--line);background:var(--card);padding:0 5px;font-size:10.5px;color:var(--ink)}
/* ---------- source panel ---------- */
.src-body{padding:14px;font-family:var(--mono);font-size:12.5px;line-height:2;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto}
.qm{background:var(--mark);color:var(--ink);padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* ---------- result ---------- */
.right{display:flex;flex-direction:column;gap:16px;min-height:300px}
.card{background:var(--card);border:1.5px solid var(--ink);box-shadow:5px 5px 0 rgba(28,24,20,.14);opacity:0;animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:14.5px}
.sec-h .no{font-family:var(--mono);font-size:12px;color:var(--red);border:1.5px solid var(--red);padding:0 6px;flex:none}
.sec-h small{font-weight:400;color:var(--ink2);font-size:12px}
.sec-b{padding:16px}
.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;border:1.5px solid var(--ink2);color:var(--ink2);padding:2px 8px}
.tag.demo{border-color:var(--green);color:var(--green)}
.conf{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin-left:auto}
.conf .bar{width:90px;height:8px;border:1px solid var(--ink);background:var(--card)}
.conf .bar i{display:block;height:100%;background:var(--red)}
.verdict{font-family:var(--serif);font-size:clamp(19px,2.6vw,25px);font-weight:900;line-height:1.6;padding:6px 0 2px;position:relative}
.verdict::before{content:'“';color:var(--red);font-size:1.4em;margin-right:2px}
.verdict::after{content:'”';color:var(--red);font-size:1.4em;margin-left:2px}
/* decode items */
.item{border:1px solid var(--line);border-left:4px solid var(--ink2);background:#FFFEFB;margin-bottom:12px;padding:13px 15px}
.item:last-child{margin-bottom:0}
.item.lv-fact{border-left-color:#8A8175}
.item.lv-likely{border-left-color:var(--blue)}
.item.lv-risk{border-left-color:var(--red)}
.item-top{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.quote{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);background:var(--mark);padding:1px 6px;word-break:break-all}
.lv{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;padding:2px 8px;border:1.5px solid;flex:none;margin-left:auto}
.lv-fact .lv,.lv.lv-fact{color:#8A8175;border-color:#8A8175}
.lv.lv-likely{color:var(--blue);border-color:var(--blue)}
.lv.lv-risk{color:var(--red);border-color:var(--red)}
.lv-fact .stamp2{display:none}
.pair{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px;font-size:13.5px;line-height:1.7}
.pair dt{font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.1em;padding-top:3px;white-space:nowrap}
.pair dd .sub{font-weight:800;font-size:14.5px}
.pair dd .lit{color:var(--ink2);text-decoration:line-through;text-decoration-color:rgba(193,58,23,.5);margin-right:10px;font-size:12.5px}
.why{margin-top:8px;font-size:12.5px;color:var(--ink2);line-height:1.7}
.why::before{content:'依据 ';font-family:var(--mono);font-size:10.5px;color:var(--red);letter-spacing:.1em}
.act{margin-top:10px;background:#F2EEE5;border-left:3px solid var(--ink);padding:8px 10px;font-size:13px;line-height:1.7;display:flex;gap:10px;align-items:flex-start}
.act .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--paper);background:var(--ink);padding:2px 6px;flex:none;margin-top:1px}
.act p{flex:1}
/* flags & questions */
.flags li,.qlist li{list-style:none;display:flex;gap:10px;padding:7px 0;font-size:13.5px;line-height:1.7;border-bottom:1px dashed var(--line)}
.flags li:last-child,.qlist li:last-child{border-bottom:0}
.flags li::before{content:'▲';color:var(--red);font-size:10px;margin-top:5px;flex:none}
.qlist li::before{content:attr(data-n);font-family:var(--mono);color:var(--blue);font-weight:700;flex:none;margin-top:1px}
.copy-all{margin-left:auto;font-family:var(--mono);font-size:11px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:3px 10px;cursor:pointer;transition:.12s}
.copy-all:hover{background:var(--ink);color:var(--paper)}
/* silence */
.silence{border-style:dashed}
.silence .card-in{border:1.5px dashed var(--ink2);padding:14px 16px;font-size:13.5px;line-height:1.9;color:var(--ink);background:repeating-linear-gradient(-45deg,transparent 0 9px,rgba(28,24,20,.025) 9px 10px)}
.silence .sec-h{border-bottom:0}
/* shadow */
.shadow-card{border-color:var(--plum)}
.shadow-card .sec-h .no{color:var(--plum);border-color:var(--plum)}
.shadow-card .sec-h small b{color:var(--plum)}
.sitem{border:1px solid var(--line);border-left:4px solid var(--plum);background:#FDFAFE;margin-bottom:12px;padding:13px 15px}
.sitem:last-child{margin-bottom:0}
.srow{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:9px;font-size:13.5px;line-height:1.7}
.srow dt{font-family:var(--mono);font-size:11px;color:var(--plum);letter-spacing:.1em;padding-top:3px;white-space:nowrap}
.better{margin-top:10px;background:#F1EAF7;border-left:3px solid var(--plum);padding:8px 10px;font-size:13px;line-height:1.7;display:flex;gap:10px;align-items:flex-start}
.better .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:#fff;background:var(--plum);padding:2px 6px;flex:none;margin-top:1px}
.better p{flex:1}
.cbtn{font-family:var(--mono);font-size:10.5px;border:1px solid var(--ink2);background:transparent;color:var(--ink2);padding:2px 8px;cursor:pointer;flex:none;transition:.12s}
.cbtn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* empty / loading / error */
.empty{border:1.5px dashed var(--ink2);padding:44px 24px;text-align:center;color:var(--ink2)}
.empty .stamp{display:inline-block;font-family:var(--serif);font-size:30px;font-weight:900;letter-spacing:.3em;color:var(--red);
  border:3px double var(--red);padding:10px 22px 10px 26px;transform:rotate(-4deg);opacity:.85;margin-bottom:20px}
.empty ol{text-align:left;max-width:400px;margin:0 auto;font-size:13px;line-height:2.1;font-family:var(--mono)}
.loading{padding:26px}
.spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.lline{font-family:var(--mono);font-size:13px;color:var(--ink2);padding:7px 0;opacity:0;animation:ll .4s forwards}
@keyframes ll{to{opacity:1}}
.lline::before{content:'> ';color:var(--red)}
.lline i{display:inline-block;animation:blink 1s steps(2) infinite;font-style:normal}
@keyframes blink{50%{opacity:0}}
.err{border-left:4px solid var(--red)}
.err .sec-b{font-size:13.5px;line-height:1.8}
.err details{margin-top:10px}
.err summary{cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--ink2)}
.err pre{margin-top:8px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-all;background:#F2EEE5;padding:10px;max-height:220px;overflow:auto}
/* ---------- drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(28,24,20,.4);z-index:9;opacity:0;pointer-events:none;transition:.2s}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,94vw);background:var(--paper);border-left:2px solid var(--ink);z-index:10;
  transform:translateX(102%);transition:.25s cubic-bezier(.2,.7,.3,1);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(28,24,20,.18)}
.drawer.on{transform:none}
.dr-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:2px solid var(--ink)}
.dr-h b{font-family:var(--serif);font-size:18px}
.dr-x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--ink);line-height:1}
.dr-b{padding:18px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.dr-note{font-size:12px;line-height:1.8;color:var(--ink2);background:var(--card);border:1px dashed var(--line);padding:10px 12px}
.dr-note b{color:var(--green)}
.field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink2);margin-bottom:6px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips button{font-family:var(--sans);font-size:12.5px;padding:5px 11px;border:1.5px solid var(--ink2);background:var(--card);cursor:pointer;color:var(--ink);transition:.12s}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field input{width:100%;font-family:var(--mono);font-size:13px;padding:9px 11px;border:1.5px solid var(--ink2);background:var(--card);color:var(--ink);outline:0}
.field input:focus{border-color:var(--ink)}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1}
.keyrow button{font-family:var(--mono);font-size:11px;border:1.5px solid var(--ink2);background:var(--card);cursor:pointer;padding:0 10px;color:var(--ink2)}
.dr-actions{display:flex;gap:10px;margin-top:4px}
.btn{flex:1;font-family:var(--sans);font-size:14px;font-weight:800;padding:11px 0;cursor:pointer;border:2px solid var(--ink);transition:.15s}
.btn.p{background:var(--ink);color:var(--paper);box-shadow:3px 3px 0 rgba(193,58,23,.85)}
.btn.s{background:var(--card);color:var(--ink);box-shadow:3px 3px 0 rgba(28,24,20,.16)}
.btn:hover{transform:translate(-1px,-1px)}
.tstatus{font-family:var(--mono);font-size:12px;line-height:1.7;min-height:18px}
.tstatus.ok{color:var(--green)}
.tstatus.bad{color:var(--red)}
/* toast */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);
  font-size:13px;padding:10px 20px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:4px 4px 0 rgba(193,58,23,.8)}
#toast.on{opacity:1;transform:translateX(-50%)}
footer{position:relative;z-index:1;text-align:center;font-family:var(--mono);font-size:11px;color:#A79C89;padding:0 20px 26px;letter-spacing:.1em}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>SUBTEXT<em>潜台词解码器</em></div>
  <div class="tagline">在招聘方学会说人话之前，先让你读懂他们。</div>
  <button class="hbtn" id="btnSettings">模型配置<span class="dot"></span></button>
  <div class="privacy"><b>你的 API Key 与文本只存在这台浏览器</b>。</div>
</header>

<main class="wrap">
  <section class="left">
    <div class="pane">
      <div class="pane-h"><b>原始文本</b><span id="charCount">0 字</span></div>
      <textarea id="inputText" placeholder="粘贴以下任意一类：&#10;· JD 招聘启事&#10;· 和 HR / 老板的聊天记录&#10;· 面试对话或转写&#10;· Offer 邮件 / 谈薪记录&#10;· 公司公开信息&#10;· 拒信 / 反馈&#10;&#10;类型会被自动识别，无需选择。"></textarea>
    </div>
    <div class="tools">
      <div class="samples">试试示例：
        <button data-ex="0">BOSS 对话</button>
        <button data-ex="1">招聘 JD</button>
        <button data-ex="2">Offer 邮件</button>
        <button data-ex="3">面试转写</button>
        <button data-ex="4">拒信</button>
        <button data-ex="5">公司信息</button>
      </div>
      <label class="switch"><input type="checkbox" id="shadowToggle"><span class="tr"></span>双向审视 <small>也翻译你自己发出去的话</small></label>
      <button class="decode-btn" id="btnDecode">开始解码</button>
      <div class="hint" id="cfgHint"><span class="dot2"></span><span id="cfgHintTxt">未配置模型 — 点击右上角「模型配置」填入你自己的 API Key</span>&nbsp;<kbd>Ctrl</kbd>+<kbd>Enter</kbd></div>
    </div>
    <div class="pane" id="srcPanel" hidden>
      <div class="pane-h"><b>原文 · 证据高亮</b><span>quote → mark</span></div>
      <div class="src-body" id="srcBody"></div>
    </div>
  </section>

  <section class="right" id="resultArea">
    <div class="empty">
      <div class="stamp">等待解码</div>
      <ol>
        <li>① 左侧粘贴文本，或点一个内置示例</li>
        <li>② 首次使用先在右上角配置你的模型 API Key</li>
        <li>③ 输出五段式：总判 / 逐条解码 / 红灯 / 反问 / 沉默的信息</li>
      </ol>
    </div>
  </section>
</main>

<footer>SUBTEXT </footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="dr-h"><b>模型配置 · BYOK</b><button class="dr-x" id="btnCloseDr">×</button></div>
  <div class="dr-b">
    <div class="field"><label>预设服务商</label>
      <div class="chips" id="presetChips"></div>
    </div>
    <div class="field"><label>API BASE URL</label><input id="f_base" placeholder="https://api.deepseek.com/v1"></div>
    <div class="field"><label>模型名</label><input id="f_model" placeholder="deepseek-chat"></div>
    <div class="field"><label>API KEY</label>
      <div class="keyrow"><input id="f_key" type="password" placeholder="sk-..." autocomplete="off"><button id="btnEye">显示</button></div>
    </div>
    <div class="tstatus" id="testStatus"></div>
    <div class="dr-actions">
      <button class="btn s" id="btnTest">测试连接</button>
      <button class="btn p" id="btnSave">保存到本机</button>
    </div>
    <div class="dr-actions"><button class="btn s" id="btnClear" style="color:var(--red)">清除本机配置</button></div>
  </div>
</aside>
<div id="toast"></div>

<script>

const CFG_KEY='subtext.cfg';
const PRESETS=[
  {name:'DeepSeek',base:'https://api.deepseek.com/v1',model:'deepseek-chat'},
  {name:'火山方舟',base:'https://ark.cn-beijing.volces.com/api/v3',model:'doubao-seed-1.6-32k-250615'},

const getCfg=()=>{try{return JSON.parse(localStorage.getItem(CFG_KEY))||{}}catch(e){return{}}};
function refreshHint(){
  const c=getCfg(),ok=c.base&&c.model&&c.key;
  const h=$('#cfgHint');h.classList.toggle('ok',!!ok);
  $('#cfgHintTxt').textContent=ok?('已配置 · '+(c.name||'自定义')+' · '+c.model):'未配置模型 — 点击右上角「模型配置」填入你自己的 API Key';

}

/* ============ 设置抽屉 ============ */
const drawer=$('#drawer'),overlay=$('#overlay');
function openDr(){const c=getCfg();$('#f_base').value=c.base||'';$('#f_model').value=c.model||'';$('#f_key').value=c.key||'';
  $('#testStatus').textContent='';$('#testStatus').className='tstatus';renderChips();drawer.classList.add('on');overlay.classList.add('on');}
function closeDr(){drawer.classList.remove('on');overlay.classList.remove('on');}
$('#btnSettings').onclick=openDr;$('#btnCloseDr').onclick=closeDr;overlay.onclick=closeDr;
function renderChips(){
  const c=getCfg();const box=$('#presetChips');box.innerHTML='';
  PRESETS.forEach(p=>{
    const b=document.createElement('button');b.textContent=p.name;
    b.className=(c.base===p.base&&c.model===p.model)?'on':'';
    b.onclick=()=>{$('#f_base').value=p.base;$('#f_model').value=p.model;renderChips();};
    box.appendChild(b);
  });
  const cb=document.createElement('button');cb.textContent='自定义';
  cb.className=PRESETS.some(p=>p.base===c.base&&p.model===c.model)?'':'on';
  cb.onclick=()=>{$('#f_base').value='';$('#f_model').value='';$('#f_base').focus();renderChips();};
  box.appendChild(cb);
}
$('#btnEye').onclick=()=>{const k=$('#f_key');k.type=k.type==='password'?'text':'password';$('#btnEye').textContent=k.type==='password'?'显示':'隐藏';};
function saveCfg(){
  const base=$('#f_base').value.trim().replace(/\/+$/,''),model=$('#f_model').value.trim(),key=$('#f_key').value.trim();
  if(!base||!model||!key){toast('Base URL / 模型名 / Key 需全部填写');return false;}
  const p=PRESETS.find(p=>p.base===base&&p.model===model);
  try{
    localStorage.setItem(CFG_KEY,JSON.stringify({base,model,key,name:p?p.name:'自定义'}));
    const back=localStorage.getItem(CFG_KEY);
    if(!back||back.indexOf(key)<0)throw new Error('readback mismatch');
  }catch(e){
    const st=$('#testStatus');st.className='tstatus bad';
    st.textContent='无法写入本地存储：浏览器禁用了 localStorage（隐私窗口 / 阻止 Cookie 设置 / 存储已满）。请调整后重试。';
    return false;
  }
  refreshHint();closeDr();toast('配置已保存到本浏览器');
  return true;
}
$('#btnSave').onclick=saveCfg;
$('#btnClear').onclick=()=>{try{localStorage.removeItem(CFG_KEY)}catch(e){}refreshHint();closeDr();toast('已清除本机配置');};
$('#btnTest').onclick=async()=>{
  const base=$('#f_base').value.trim().replace(/\/+$/,''),model=$('#f_model').value.trim(),key=$('#f_key').value.trim();
  const st=$('#testStatus');
  if(!base||!model||!key){st.className='tstatus bad';st.textContent='请先填齐 Base URL / 模型名 / Key';return;}
  st.className='tstatus';st.textContent='测试中…';
  const ctrl=new AbortController();const tid=setTimeout(()=>ctrl.abort(),30000);
  try{
    const r=await fetch(base+'/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model,messages:[{role:'user',content:'回复：ok'}],max_tokens:8,stream:false}),signal:ctrl.signal});
    clearTimeout(tid);
    if(r.ok){
      st.className='tstatus ok';st.textContent='连接成功 · '+model+' 可用，正在自动保存…';
      if(saveCfg())toast('连接成功，配置已自动保存');
    }
    else{let d='';try{d=(await r.json()).error?.message||''}catch(e){}
      st.className='tstatus bad';
      st.textContent=r.status===401?'Key 无效或未授权':r.status===404?'路径不存在：检查 Base URL 是否需要以 /v1 结尾':'HTTP '+r.status+(d?' · '+d:'');}
  }catch(e){clearTimeout(tid);st.className='tstatus bad';
    st.textContent='直连失败：网络不可达，或该服务商不允许浏览器跨域调用（CORS）— 建议改用其他预设';}
};

/* ============ JSON 容错解析 ============ */
function parseJSONLoose(s){
  if(!s)return null;s=s.trim();
  const m=s.match(/```(?:json)?\s*([\s\S]*?)```/);if(m)s=m[1].trim();
  const a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a>-1&&b>a)s=s.slice(a,b+1);
  const tries=[s,
    s.replace(/,\s*([}\]])/g,'$1'),
    s.replace(/,\s*([}\]])/g,'$1').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":')];
  for(const t of tries){try{return JSON.parse(t)}catch(e){}}
  return null;
}

let running=false;
const LV={fact:['事实','lv-fact'],likely:['推测','lv-likely'],risk:['风险','lv-risk']};
$('#btnDecode').onclick=runDecode;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')runDecode();});
async function runDecode(){
  if(running)return;
  const c=getCfg();
  if(!c.base||!c.model||!c.key){
    $('#resultArea').innerHTML=needCfgCard();
    openDr();toast('请先完成模型配置并保存');return;
  }
  const text=$('#inputText').value.trim();
  if(text.length<10){toast('请先粘贴要解码的文本（至少 10 字）');return;}
  if(text.length>6000)toast('文本较长（'+text.length+' 字），模型输出可能被截断，建议分段粘贴');
  running=true;const btn=$('#btnDecode');btn.disabled=true;btn.textContent='解 码 中';
  $('#resultArea').innerHTML=loadingHTML(c.model);
  const t0=Date.now();
  elapsedTimer=setInterval(()=>{$('#elapsed').textContent=((Date.now()-t0)/1000).toFixed(0);},500);
  try{
    const ctrl=new AbortController();const tid=setTimeout(()=>ctrl.abort(),60000);
    const r=await fetch(c.base+'/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
      body:JSON.stringify({model:c.model,temperature:0.4,max_tokens:8000,stream:false,
        messages:[{role:'system',content:getPrompt()},
                  {role:'user',content:($('#shadowToggle').checked?'[双向模式开启]\n\n':'')+text}]}),
      signal:ctrl.signal});
    clearTimeout(tid);
    if(!r.ok){let d='';try{d=(await r.json()).error?.message||''}catch(e){}
      throw new Error(r.status===401?'Key 无效或未授权（HTTP 401）':'API 返回 HTTP '+r.status+(d?' · '+d:''));}
    const j=await r.json();
    const content=j.choices?.[0]?.message?.content||'';
    const data=parseJSONLoose(content);
    if(!data)showParseError(content);
    else renderResult(data,text,false);
  }catch(e){
    $('#resultArea').innerHTML=errHTML(e.name==='AbortError'?'请求超时（60 秒）。可重试，或换更快的模型 / 服务商。':esc(e.message));

}

function highlightSrc(text,quotes){
  let h=esc(text);
  const qs=[...new Set(quotes.filter(q=>q&&String(q).trim().length>=4).map(q=>String(q)))].sort((a,b)=>b.length-a.length);
  qs.forEach((q,i)=>{h=h.split(esc(q)).join('\u0001'+i+'\u0001');});
  qs.forEach((q,i)=>{h=h.split('\u0001'+i+'\u0001').join('<mark class="qm">'+esc(q)+'</mark>');});
  return h;
}
function renderResult(d,srcText,isExample){
  d.items=d.items||[];d.questions=(d.questions||[]).slice(0,3);
  const quotes=d.items.map(x=>x.quote).concat((d.shadow_items||[]).map(x=>x.quote));
  let i=0;const dl=()=>'--d:'+(i++*0.09)+'s';
  const NUM=['②','③','④','⑤','⑥'];let ni=0;const nx=()=>NUM[ni++]||'⑦';
  let html='';
  /* meta + verdict */
  html+=`<div class="card" style="${dl()}"><div class="meta">
    <span class="tag">自动识别 · ${esc(d.doc_type_cn||d.doc_type||'未知类型')}</span>
    ${isExample?'<span class="tag demo">内置示例 · 无需 API Key</span>':''}
    <span class="conf">置信 ${esc(d.confidence??'-')}<span class="bar"><i style="width:${Math.min(100,+d.confidence||0)}%"></i></span></span></div>
    <div class="sec-b"><div class="verdict">${esc(d.verdict)}</div></div></div>`;
  /* items */
  if(d.items.length){
    html+=`<div class="card" style="${dl()}"><div class="sec-h"><span class="no">${nx()}</span>逐条解码<small>引用即证据 · 颜色=强度</small></div><div class="sec-b">`;
    d.items.forEach(it=>{
      const lv=LV[it.level]||LV.likely;
      html+=`<div class="item ${lv[1]}"><div class="item-top"><span class="quote">「${esc(it.quote)}」</span><span class="lv ${lv[1]}">${lv[0]}</span></div>
      <dl class="pair"><dt>字面</dt><dd><span class="lit">${esc(it.literal)}</span></dd>
      <dt>潜台词</dt><dd><span class="sub">${esc(it.subtext)}</span></dd></dl>
      <div class="why">${esc(it.why)}</div>
      <div class="act"><span class="lab">应对</span><p>${esc(it.action)}</p><button class="cbtn" onclick="copyText(this.closest('.act').querySelector('p').textContent)">复制</button></div></div>`;
    });
    html+='</div></div>';
  }
  /* shadow */
  if(d.shadow_items&&d.shadow_items.length){
    html+=`<div class="card shadow-card" style="${dl()}"><div class="sec-h"><span class="no">${nx()}</span>双向审视<small>你的话，对方读出了什么 · <b>审视你自己</b></small></div><div class="sec-b">`;
    d.shadow_items.forEach(it=>{
      const lv=LV[it.level]||LV.likely;
      html+=`<div class="sitem"><div class="item-top"><span class="quote">「${esc(it.quote)}」</span><span class="lv ${lv[1]}">${lv[0]}</span></div>
      <dl class="srow"><dt>对方读出</dt><dd><span class="sub">${esc(it.read_as)}</span></dd></dl>
      <div class="better"><span class="lab">更优表达</span><p>${esc(it.better)}</p><button class="cbtn" onclick="copyText(this.closest('.better').querySelector('p').textContent)">复制</button></div></div>`;
    });
    html+='</div></div>';
  }
  /* red flags */
  if(d.red_flags&&d.red_flags.length){
    html+=`<div class="card" style="${dl()}"><div class="sec-h"><span class="no">${nx()}</span>红灯清单<small>需要警惕或核实</small></div><div class="sec-b"><ul class="flags">${
      d.red_flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div></div>`;
  }
  /* questions */
  if(d.questions.length){
    html+=`<div class="card" style="${dl()}"><div class="sec-h"><span class="no">${nx()}</span>你应该反问的三个问题
      <button class="copy-all" onclick="copyText([...document.querySelectorAll('.qlist li')].map((li,i)=>(i+1)+'. '+li.textContent.replace(/^\\d+\\.?/,'')).join('\\n'))">一键复制全部</button></div>
      <div class="sec-b"><ul class="qlist">${d.questions.map((q,n)=>`<li data-n="0${n+1}">${esc(q)}</li>`).join('')}</ul></div></div>`;
  }
  /* silence */
  if(d.silence){
    html+=`<div class="card silence" style="${dl()}"><div class="sec-h"><span class="no">${nx()}</span>沉默的信息<small>没说出口的，往往更关键</small></div>
    <div class="sec-b"><div class="card-in">${esc(d.silence)}</div></div></div>`;
  }
  $('#resultArea').innerHTML=html;
  const sp=$('#srcPanel');sp.hidden=false;
  $('#srcBody').innerHTML=highlightSrc(srcText,quotes);
  window.scrollTo({top:0,behavior:'smooth'});
}
